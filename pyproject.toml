[project]
name = "editalos"
version = "3.0.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn>=0.29,<1.0",
    "python-multipart>=0.0.9,<1.0",
    "tzdata>=2025.2",
    "httpx>=0.27,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.ruff]
line-length = 120
exclude = ["data", "data-demo"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E402", "E501", "E701", "E702", "E703", "F401", "F811", "W291", "W293"]
